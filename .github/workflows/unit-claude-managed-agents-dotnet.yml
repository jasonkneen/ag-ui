name: unit / claude-managed-agents-dotnet

on:
  push:
    branches: [main]
    paths:
      - "integrations/claude-managed-agents/dotnet/**"
      - "sdks/dotnet/src/**"
      - ".github/workflows/unit-claude-managed-agents-dotnet.yml"
  pull_request:
    branches: [main]
    paths:
      - "integrations/claude-managed-agents/dotnet/**"
      - "sdks/dotnet/src/**"
      - ".github/workflows/unit-claude-managed-agents-dotnet.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: dotnet / build + unit
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: integrations/claude-managed-agents/dotnet
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          # global.json pins the 10.0 SDK; 8.0/9.0 runtimes are needed
          # because the library multi-targets net8.0/net9.0/net10.0.
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Build (library, example, tests)
        run: dotnet build -c Release

      - name: Run unit tests
        run: dotnet test tests/AGUI.ClaudeManagedAgents.Tests -c Release --no-build
